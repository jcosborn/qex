name: test
on:
  pull_request:
  push:
#    branches:
#      - 'devel'
#      - 'master'

jobs:
  build:
    strategy:
      matrix:
        mpi-impl: [openmpi, mpich]
        #nim-branch: [version-2-0, version-2-2, devel]
        #nim-branch: [v2.0.14, v2.2.2]
        nim-branch: [v2.0.16, version-2-2, devel]
        #fuel-compat: [0, 1]
        fuel-compat: [0]
      fail-fast: false
    name: nim-${{ matrix.nim-branch }}-${{ matrix.mpi-impl }}-FUELCompat:${{ matrix.fuel-compat }}
    runs-on: ubuntu-26.04
    steps:
    - name: environment
      run: |
        echo "FUELCompat=${{ matrix.fuel-compat }}" >> $GITHUB_ENV
        sudo sh -c 'echo %e.core.%p.%t > /proc/sys/kernel/core_pattern'
    - name: install packages
      run: |
        sudo apt-get update
        sudo apt-get install numdiff hwloc-nox libhwloc-dev gdb
        if test ${{ matrix.mpi-impl }} = openmpi; then sudo apt-get install openmpi-bin libopenmpi-dev; fi
        if test ${{ matrix.mpi-impl }} = mpich; then sudo apt-get install mpich libmpich-dev; fi
    - name: system info
      run: |
        free
        cat /proc/cpuinfo
        hwloc-ls
        gcc -v
        command -v mpicc mpiexec
        mpicc -v
        cat /proc/sys/kernel/core_pattern
    - name: check MPI ranks
      run: |
        cat > "$RUNNER_TEMP/check-mpi.c" <<'EOF'
        #include <mpi.h>
        #include <stdio.h>
        int main(int argc, char **argv) {
          int rank, size, provided;
          MPI_Init_thread(&argc, &argv, MPI_THREAD_FUNNELED, &provided);
          MPI_Comm_rank(MPI_COMM_WORLD, &rank);
          MPI_Comm_size(MPI_COMM_WORLD, &size);
          printf("MPI rank %d of %d\n", rank, size);
          fflush(stdout);
          if (size != 2) MPI_Abort(MPI_COMM_WORLD, 1);
          MPI_Finalize();
          return 0;
        }
        EOF
        mpicc "$RUNNER_TEMP/check-mpi.c" -o "$RUNNER_TEMP/check-mpi"
        timeout -k 5s 60s mpiexec -n 2 "$RUNNER_TEMP/check-mpi"
    - name: checkout Nim
      uses: actions/checkout@v7
      with:
        repository: nim-lang/Nim
        ref: ${{ matrix.nim-branch }}
        path: Nim
    - name: build Nim & nimble
      working-directory: Nim
      run: |
        #. ci/funs.sh
        #nimBuildCsourcesIfNeeded
        #./bin/nim c --noNimblePath --skipUserCfg --skipParentCfg --hints:off koch
        #./koch boot -d:release -d:danger --skipUserCfg --skipParentCfg --hints:off
        #./koch nimble -d:release -d:danger --skipUserCfg --skipParentCfg --hints:off
        ./build_all.sh
    - name: set path to nim
      run: echo "${{ github.workspace }}/Nim/bin" >> $GITHUB_PATH
    - name: checkout
      uses: actions/checkout@v7
      with:
        path: qex
    - name: test build flags
      working-directory: qex
      run: nim tests/tbuildflags.nims
    - name: test numeric comparator
      working-directory: qex
      run: python3 -B -m unittest discover -s tests -p test_diffnum.py
    - name: install nimble dependencies
      working-directory: qex
      run: nimble install -dy
    - name: install qmp & qio
      working-directory: qex
      run: ./bootstrap-travis
    - name: configure
      working-directory: qex
      run: QMPDIR=qmp QIODIR=qio ./configure
    - name: make tests
      working-directory: qex
      run: make tests
    - name: testscript
      working-directory: qex
      run: |
        ulimit -c unlimited
        CLEANUPJOBS=./finalizeTests ./testscript.sh
    - name: runtests
      working-directory: qex
      run: |
        ulimit -c unlimited
        CLEANUPJOBS=./finalizeTests ./runtests.sh
    - name: build graph tests
      working-directory: qex
      timeout-minutes: 30
      run: |
        make ARGS="--assertions:on" \
          graph/tests/tgraph graph/tests/tfunctional \
          graph/tests/tgvalueu1 graph/tests/tgstorageu1 graph/tests/tgstorage \
          graph/tests/tgjac graph/tests/tghmcu1 graph/tests/tgstouttrainu1 \
          graph/tests/tgplaqstencil graph/tests/tstencilmpi
    - name: build SSE matrix tests
      working-directory: qex
      timeout-minutes: 15
      run: |
        test "$RUNNER_ARCH" = X64
        mkdir -p build_sse
        cd build_sse
        QMPDIR="$PWD/../qmp" QIODIR="$PWD/../qio" ../configure
        make ARGS="-d:SSE --assertions:on" base/tmatrixFields graph/tests/tgmatrix
    - name: run graph tests
      working-directory: qex
      timeout-minutes: 20
      env:
        OMP_NUM_THREADS: '1'
        OMP_DYNAMIC: 'FALSE'
      shell: bash
      run: |
        set -euo pipefail
        logs="$RUNNER_TEMP/graph-tests"
        mkdir -p "$logs"
        run_test() {
          local name=$1
          shift
          local log="$logs/$name.log"
          timeout -k 10s 5m "$@" 2>&1 | tee "$log"
          local count
          count=$(grep -cE '^[[:space:]]*\[OK\] ' "$log" || true)
          if (( count == 0 )) || grep -q '\[FAILED\]' "$log"; then
            echo "::error::$name did not complete a nonempty passing suite"
            return 1
          fi
          echo "$name: $count passing cases"
        }
        for name in tgraph tfunctional tghmcu1; do
          run_test "$name" "./bin/$name"
        done
        for name in tgvalueu1 tgstorageu1 tgstorage tgjac tgstouttrainu1; do
          run_test "$name" "./bin/$name" -expectRanks:1
        done
        run_test tgstorage-threads env OMP_NUM_THREADS=2 ./bin/tgstorage -expectRanks:1
        grep -F 'Running with 1 ranks and 2 threads per rank' "$logs/tgstorage-threads.log"
        run_test tgplaqstencil-mpi mpiexec -n 2 ./bin/tgplaqstencil \
          -expectRanks:2 -lat:4,4,4 -rankgeom:2,1,1
        grep -F 'Running with 2 ranks and 1 threads per rank' "$logs/tgplaqstencil-mpi.log"
        run_test tstencilmpi-mpi mpiexec -n 2 ./bin/tstencilmpi \
          -expectRanks:2 -lat:8,4,4,4 -rankgeom:2,1,1,1
        grep -F 'Running with 2 ranks and 1 threads per rank' "$logs/tstencilmpi-mpi.log"
        run_test tmatrixFields-sse ./build_sse/bin/tmatrixFields
        run_test tgmatrix-sse ./build_sse/bin/tgmatrix -expectRanks:1
    - name: make bench
      working-directory: qex
      run: make /bench
    - name: benchLinalg
      working-directory: qex
      run: bin/benchLinalg
